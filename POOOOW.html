<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POOOOW</title>
    <style>
        body { margin: 0; padding: 0; background: #000; }
    </style>
</head>
<body>
<script>
    // For iPad OS 1.0+ - Use native screenshot via WebKit
    if (typeof webkit !== 'undefined' && webkit.messageHandlers) {
        webkit.messageHandlers.screenshot.postMessage(null);
    } else {
        // Fallback for web browsers - open screenshot via system
        window.location.href = 'file:///var/mobile/Media/DCIM/';
    }
</script>
</body>
</html>
